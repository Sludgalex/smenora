name: Предложение функции
description: Предложить улучшение рабочего сценария SMENORA
title: "[FEATURE] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Опишите рабочую задачу, а не только желаемую кнопку или экран. Не публикуйте персональные или служебные данные.
  - type: textarea
    id: scenario
    attributes:
      label: Рабочий сценарий
      description: Кто выполняет действие и в какой ситуации?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Как это делается сейчас
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Какой результат нужен
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Ограничения и важные условия
      description: Например, Windows 7, локальная работа, отсутствие интернета, печатная форма, нормативные требования.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка приватности
      options:
        - label: В описании нет персональных или служебных данных.
          required: true
